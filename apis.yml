name: Automatic
description: >-
  Automatic (Automatic Labs, Inc.) was a San Francisco connected-car company founded in 2011
  by Thejo Kote and Jerry Jariyasunant. Its OBD-II adapter and companion mobile app turned
  almost any car built since 1996 into a connected car, adding trip logging, fuel and MPG
  tracking, engine-light diagnostics, parking recall, and automatic crash alerts. Automatic
  ran a public developer platform at developer.automatic.com built around three surfaces: a
  REST API exposing trip, user, and vehicle data; an Events API delivering real-time driving
  events such as ignition on/off, hard braking, acceleration, speeding, and location changes
  over webhooks and websockets; and a private-beta Streaming SDK that read raw OBD-II data
  from the second-generation adapter over Bluetooth. SiriusXM acquired the company on
  2017-04-27 for approximately $115 million, and all operations were shut down on 2020-05-28.
  THIS COMPANY IS DEFUNCT — no API, developer portal, or documentation remains online, and
  the automatic.com domain now belongs to the unrelated company Automattic. This profile is
  retained as a historical record of a notable connected-car API platform.
